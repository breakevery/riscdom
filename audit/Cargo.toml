[package]
name = "audit"
version.workspace = true
edition.workspace = true

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
hex = "0.4"

[[bin]]
name = "audit-verify"
path = "src/bin/verify.rs"
