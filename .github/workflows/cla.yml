# CLA Assistant (v0.5 batch 5).
#
# A contributor licence agreement is what lets this project stay open core and still
# distribute derived work under a commercial proprietary licence, so it has to be in
# place before the first external pull request rather than after it.
#
# SECURITY -- read before editing.
# This workflow uses `pull_request_target`, so it runs with the BASE repository's
# token and its secrets. It must therefore never check out or execute the pull
# request's code:
#   * there is deliberately NO `actions/checkout` step;
#   * nothing from the event payload is executed -- the payload is read by the action
#     for the comment text and the pull request number only;
#   * the signature file is the only thing this job writes.
# See https://securitylab.github.com/research/github-actions-preventing-pwn-requests/
name: CLA Assistant

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

# Least privilege for what the action actually does: read the event, write the
# signature file, write the commit status and the pull request comment.
permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    name: contributor license agreement
    runs-on: ubuntu-latest
    steps:
      # Run on a pull request event, on the signature sentence, or on `recheck`.
      # An unrelated comment must not spend a run.
      - name: CLA assistant
        if: >-
          github.event_name == 'pull_request_target' ||
          github.event.comment.body == 'recheck' ||
          github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
        uses: contributor-assistant/github-action@v2.5.0
        env:
          # The action writes the signature file and the status with this token.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # A personal access token (`PERSONAL_ACCESS_TOKEN`) is only needed when the
          # signatures live in another repository (`remote-organization-name` /
          # `remote-repository-name`). They live here, so no PAT is wired in.
        with:
          path-to-signatures: 'signatures/version1/cla.json'
          path-to-document: 'https://github.com/breakevery/riscdom/blob/main/CLA.md'
          branch: 'main'
          allowlist: breakevery,bot*
