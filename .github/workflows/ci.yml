# Cross-platform CI checks.
#
# ONE SOURCE OF TRUTH
# -------------------
# The `gate` job does not keep its own list of commands: it installs the tools the
# gate needs (Rust + Node) and runs `sh scripts/gate.sh`. Everything the local gate
# checks, CI checks the same way, and a step can never drift apart between the two
# again. Do NOT add `cargo ...` / `node ...` checks to this file -- put them in the
# gate.
#
# DELIBERATE DIFFERENCES BETWEEN CI AND A LOCAL (WINDOWS) GATE
# -----------------------------------------------------------
# `scripts/gate.sh` prints every skip with a reason; nothing is skipped silently.
#
# 1. **The guest-booting tests do not run here.** They need `qemu-system-riscv64`
#    and a RISC-V bare-metal GCC, which a standard runner does not have; the gate
#    sees that and runs the portable library tests instead. A developer machine
#    with both tools runs the full `cargo test`.
# 2. **`host-tauri` and `ui/src-tauri` are not linted here.** Both pull in Tauri, which
#    on Linux needs webkit2gtk / gtk / librsvg system libraries. The gate skips
#    those steps on non-Windows platforms and says so (the clippy step also covers
#    the portable `host-core`, and is skipped with it). They are linted locally on
#    Windows, which is the platform the MVP targets.
# 3. **`--ignored` tests never run in CI.** They need a real QEMU guest or a real
#    API key by design (e.g. `e2e_ui`, `real_api`), and are run by hand.
#
# The `web` job that used to build the frontend is gone: the gate builds it
# (`npm run build`), so a separate job would be exactly the duplicated command
# list this file is meant to avoid.
#
# NOTE ON YAML: step names must not contain ": " inside an unquoted scalar --
# YAML reads it as a nested mapping and GitHub rejects the whole workflow.
name: CI

on:
  push:
    branches: [main]
    # A version tag is another way in. YAML allows a single `push` key, so the tags
    # are listed beside the branch rather than in a second block; the `bundle` job
    # below is the reason they are listed at all (its `if` admits a manual dispatch
    # or a `v*` tag, and nothing else). Consequence worth knowing: `secrets` and
    # `gate` see tag pushes too, which is harmless (a release tag should pass the
    # gate anyway) and is what keeping one `push` key costs.
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  secrets:
    name: secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks scans the full history, so a shallow clone is not enough.
          fetch-depth: 0

      # gitleaks-action@v2 needs a GITLEAKS_LICENSE for organization-owned
      # private repositories, so the community binary is used instead.
      - name: install gitleaks
        run: |
          set -euo pipefail
          V=8.30.1
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${V}/gitleaks_${V}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: scan git history
        run: |
          set -euo pipefail
          if gitleaks git --help >/dev/null 2>&1; then
            gitleaks git --redact --verbose
          else
            gitleaks detect --source . --redact --verbose
          fi

  gate:
    name: gate (scripts/gate.sh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The gate needs: rustfmt + clippy, and Node >= 22.6 for the UI probes and
      # the mirror guard (they import the `.ts` modules with type stripping).
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # The gate's `npm run build` needs the frontend dependencies; installing
      # them is not a gate step, so it happens here.
      - name: install frontend dependencies
        working-directory: ui
        run: npm ci

      - name: gate
        run: sh scripts/gate.sh

  # macOS and Linux bundles (v0.7 batch B).
  #
  # This job **builds only**: no `cargo test`, no UI probe, no `cargo clippy`. The
  # one list of what "green" means is still `scripts/gate.sh` (see ONE SOURCE OF
  # TRUTH at the top of this file), and this job keeps no second command list of
  # its own -- a build is not a check. What it is for is the one thing the gate
  # cannot do: produce a `dmg` on macOS and a `deb` / `rpm` / `AppImage` on Linux.
  #
  # It runs on a manual dispatch and on a `v*` tag, never on an ordinary push or a
  # pull request: a macOS runner bills at ten times a Linux one, and bundles are
  # wanted when a release is being cut, not on every commit.
  bundle:
    name: bundle (${{ matrix.os }})
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Tauri's Linux build needs WebKitGTK and its neighbours; macOS needs nothing
      # beyond the runner's Xcode command line tools.
      - name: install linux dependencies
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libssl-dev \
            libxdo-dev \
            build-essential \
            pkg-config \
            patchelf \
            rpm \
            file \
            wget \
            curl

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # Same reason as the gate job: the build runs `npm run build` first, so the
      # frontend dependencies have to be there before it starts.
      - name: install frontend dependencies
        working-directory: ui
        run: npm ci

      # The repository's own build command (`ui/README.md`, CHANGELOG). `node` on a
      # Linux or macOS runner is a real Node, so the Windows-only launcher
      # workaround in `ENVIRONMENT.md` §11 does not apply here; GitHub sets `CI=true`,
      # which the Tauri CLI reads to skip its prompts.
      - name: build bundles
        working-directory: ui
        run: npm run tauri build

      # The bundles only: `target/release/bundle/{dmg,macos,deb,rpm,appimage}/`.
      - name: upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: riscdom-bundles-${{ matrix.os }}
          path: ui/src-tauri/target/release/bundle/**
          if-no-files-found: error
          retention-days: 14
