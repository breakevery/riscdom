# Cross-platform CI checks.
#
# WHY THIS IS NOT THE FULL TEST SUITE
# -----------------------------------
# The complete suite (sandbox / agent / host end-to-end) needs a local QEMU
# (`qemu-system-riscv64`) plus an `riscv64-unknown-elf-gcc` cross compiler and a
# machine that can actually boot a VM. Standard GitHub runners have neither, and
# installing them is expensive/brittle — so those tests are run **locally** by
# the developer (`cargo test`) before releasing, not here.
#
# WHY `host` IS NOT LINTED HERE
# -----------------------------
# `host` depends on Tauri, which on Linux needs system libraries
# (webkit2gtk / gtk / librsvg). The MVP targets Windows, so `host` is linted and
# checked locally on Windows. CI covers the portable crates: audit / sandbox /
# agent. (`ui` is a separate Tauri app, not a workspace member, and is covered
# by the `web-checks` job.)
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  secrets:
    name: secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks scans the full history, so a shallow clone is not enough.
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Fallback if the action is unavailable for this repository (e.g. a
      # private org repo that wants a licence-free scan). Replace the step above
      # with:
      #
      #   - name: Install gitleaks
      #     run: |
      #       curl -sSL https://github.com/gitleaks/gitleaks/releases/latest/download/gitleaks_linux_x64.tar.gz \
      #         | tar xz -C /usr/local/bin gitleaks
      #   - name: Scan
      #     run: gitleaks detect --source . --redact --verbose

  rust-checks:
    name: rust (fmt / clippy / check / audit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: clippy (portable crates: audit / sandbox / agent)
        run: cargo clippy -p audit -p sandbox -p agent --all-targets -- -D warnings

      - name: check (portable crates: audit / sandbox / agent)
        run: cargo check -p audit -p sandbox -p agent

      # The audit crate has no external toolchain needs, so its unit tests can
      # run anywhere.
      - name: audit crate tests
        run: cargo test -p audit --lib

  web-checks:
    name: web (tsc + vite build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: install dependencies
        working-directory: ui
        run: npm ci

      # Runs `tsc && vite build`. `npm run tauri build` is deliberately NOT run:
      # it needs platform system dependencies and a packaging environment.
      - name: build
        working-directory: ui
        run: npm run build
