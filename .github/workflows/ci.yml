# Cross-platform CI checks.
#
# WHY THIS IS NOT THE FULL TEST SUITE
# -----------------------------------
# The complete suite (sandbox / agent / host end-to-end) needs a local QEMU
# (`qemu-system-riscv64`) plus an `riscv64-unknown-elf-gcc` cross compiler and a
# machine that can actually boot a VM. Standard GitHub runners have neither, and
# installing them is expensive/brittle -- so those tests are run **locally** by
# the developer (`cargo test`) before releasing, not here.
#
# WHY `host` IS NOT LINTED HERE
# -----------------------------
# `host` depends on Tauri, which on Linux needs system libraries
# (webkit2gtk / gtk / librsvg). The MVP targets Windows, so `host` is linted and
# checked locally on Windows. CI covers the portable crates: audit / sandbox /
# agent. (`ui` is a separate Tauri app, not a workspace member, and is covered
# by the `web-checks` job.)
#
# NOTE ON YAML: step names must not contain ": " inside an unquoted scalar --
# YAML reads it as a nested mapping and GitHub rejects the whole workflow.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  secrets:
    name: secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks scans the full history, so a shallow clone is not enough.
          fetch-depth: 0

      # gitleaks-action@v2 needs a GITLEAKS_LICENSE for organization-owned
      # private repositories, so the community binary is used instead.
      - name: install gitleaks
        run: |
          set -euo pipefail
          V=8.30.1
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${V}/gitleaks_${V}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: scan git history
        run: |
          set -euo pipefail
          if gitleaks git --help >/dev/null 2>&1; then
            gitleaks git --redact --verbose
          else
            gitleaks detect --source . --redact --verbose
          fi

  rust-checks:
    name: rust (fmt / clippy / check / audit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: rustfmt
        run: cargo fmt --all -- --check

      # Portable crates only (host is excluded: Tauri needs Linux system libs).
      - name: clippy (portable crates audit sandbox agent)
        run: cargo clippy -p audit -p sandbox -p agent --all-targets -- -D warnings

      - name: check (portable crates audit sandbox agent)
        run: cargo check -p audit -p sandbox -p agent

      # The audit crate has no external toolchain needs, so its unit tests can
      # run anywhere.
      - name: audit crate tests
        run: cargo test -p audit --lib

  web-checks:
    name: web (tsc and vite build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: install dependencies
        working-directory: ui
        run: npm ci

      # Runs `tsc && vite build`. `npm run tauri build` is deliberately NOT run:
      # it needs platform system dependencies and a packaging environment.
      - name: build
        working-directory: ui
        run: npm run build
