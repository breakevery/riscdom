# Cross-platform CI checks.
#
# ONE SOURCE OF TRUTH
# -------------------
# The `gate` job does not keep its own list of commands: it installs the tools the
# gate needs (Rust + Node) and runs `sh scripts/gate.sh`. Everything the local gate
# checks, CI checks the same way, and a step can never drift apart between the two
# again. Do NOT add `cargo ...` / `node ...` checks to this file -- put them in the
# gate.
#
# DELIBERATE DIFFERENCES BETWEEN CI AND A LOCAL (WINDOWS) GATE
# -----------------------------------------------------------
# `scripts/gate.sh` prints every skip with a reason; nothing is skipped silently.
#
# 1. **The guest-booting tests do not run here.** They need `qemu-system-riscv64`
#    and a RISC-V bare-metal GCC, which a standard runner does not have; the gate
#    sees that and runs the portable library tests instead. A developer machine
#    with both tools runs the full `cargo test`.
# 2. **`--ignored` tests never run in CI.** They need a real QEMU guest or a real
#    API key by design (e.g. `e2e_ui`, `real_api`), and are run by hand.
# 3. **Linux installs the system libraries the gate needs.** The gate lints and checks
#    every workspace crate on both platforms, and one of them has a Linux system
#    dependency: `host-core` reaches `keyring` -> `dbus-secret-service` ->
#    `libdbus-sys`, which needs `dbus-1`. The `gate` job installs it.
#
# The desktop application's `bundle` job left with the management program (v1.0 M8-4b):
# `riscdom-adminapp` builds the bundles, and its own gate checks the front end.
#
# NOTE ON YAML: step names must not contain ": " inside an unquoted scalar --
# YAML reads it as a nested mapping and GitHub rejects the whole workflow.
name: CI

on:
  push:
    branches: [main]
    # A version tag is another way in. YAML allows a single `push` key, so the tags
    # are listed beside the branch rather than in a second block; the `bundle` job
    # below is the reason they are listed at all (its `if` admits a manual dispatch
    # or a `v*` tag, and nothing else). Consequence worth knowing: `secrets` and
    # `gate` see tag pushes too, which is harmless (a release tag should pass the
    # gate anyway) and is what keeping one `push` key costs.
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  secrets:
    name: secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks scans the full history, so a shallow clone is not enough.
          fetch-depth: 0

      # gitleaks-action@v2 needs a GITLEAKS_LICENSE for organization-owned
      # private repositories, so the community binary is used instead.
      - name: install gitleaks
        run: |
          set -euo pipefail
          V=8.30.1
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${V}/gitleaks_${V}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: scan git history
        run: |
          set -euo pipefail
          if gitleaks git --help >/dev/null 2>&1; then
            gitleaks git --redact --verbose
          else
            gitleaks detect --source . --redact --verbose
          fi

  gate:
    name: gate (scripts/gate.sh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The gate lints and checks **every** workspace crate on Linux as well, and
      # `host-core` has a system dependency there: it reaches `keyring` ->
      # `dbus-secret-service` -> `libdbus-sys`, which probes for the system `dbus-1`
      # library with pkg-config.
      - name: install system dependencies
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            libdbus-1-dev \
            pkg-config \
            libssl-dev \
            build-essential

      # The gate needs: rustfmt + clippy, and Node for the TypeScript SDK tests and
      # the mirror guard (they import the `.ts` modules with type stripping).
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: gate
        run: sh scripts/gate.sh

  # The two server programs (v1.0 batch BF / M7b-2).
  #
  # `bundle` above packs the desktop application; this job packs what a host runs
  # headless -- `riscdom-server` and `riscdom-relay` -- through the repository's own
  # packer, `scripts/pack.sh` (batch BE, decisions §124). It **builds only**: no
  # `cargo test`, no clippy, no UI probe. The one list of what "green" means is still
  # `scripts/gate.sh` (ONE SOURCE OF TRUTH at the top of this file).
  #
  # Same trigger as `bundle`, for the same reason: a manual dispatch or a `v*` tag,
  # never an ordinary push or a pull request. A macOS runner bills at ten times a
  # Linux one, and these archives are wanted when a release is being cut, not on every
  # commit. The job does not tag and does not publish -- it only leaves the archives as
  # run artifacts; cutting the release is a separate, authorised act (batch BG).
  #
  # Windows is deliberately absent. The packer's Windows half is `scripts/pack.ps1`
  # (it writes `.zip` through PowerShell's own `Compress-Archive`, so it needs no
  # external `zip`), and no Windows runner is wired up yet -- that is M7b-4, its own
  # batch with its own runner.
  server-bundle:
    name: server-bundle (${{ matrix.os }})
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # `server` reaches `host-core`, whose `keyring` backend on Linux builds
      # `libdbus-sys` and probes for the system `dbus-1` with `pkg-config`; macOS needs
      # nothing beyond the runner's Xcode command line tools. The list is the one the
      # Linux half of `bundle` installs, kept identical so a missing library cannot be a
      # silent difference between the two jobs.
      - name: install linux dependencies
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libssl-dev \
            libdbus-1-dev \
            libxdo-dev \
            build-essential \
            pkg-config

      # Build-only, so no `components:` -- rustfmt and clippy are the gate's lint tools
      # and this job runs no lint (the same reason `bundle` asks for neither).
      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # The packer copies the built front end (`ui/dist/app`) into the server package,
      # so the dependencies come in here -- and the build is its own visible step, so a
      # frontend failure is named rather than buried inside the packer.
      - name: install frontend dependencies
        working-directory: ui
        run: npm ci

      - name: build frontend
        working-directory: ui
        run: npm run build

      # The repository's own packer (batch BE). `--skip-ui-build` because the front end
      # was just built above; the version comes from `[workspace.package] version` and
      # the platform from the runner, exactly as it does on a developer machine.
      - name: pack server programs
        run: sh scripts/pack.sh --skip-ui-build --output-dir target/dist

      # Both unix archives: `riscdom-server-<version>-<platform>.tar.gz` and
      # `riscdom-relay-<version>-<platform>.tar.gz`.
      - name: upload archives
        uses: actions/upload-artifact@v4
        with:
          name: riscdom-servers-${{ matrix.os }}
          path: target/dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14
