[package]
name = "cli"
description = "riscdom: the command-line control-plane client"
version.workspace = true
edition.workspace = true

[[bin]]
name = "riscdom"
path = "src/main.rs"

[lib]
name = "riscdom_cli"
path = "src/lib.rs"

[dependencies]
# The control plane itself, for the embedded local mode: `Server::start` on
# 127.0.0.1:0, so the CLI talks HTTP to itself instead of reaching into the kernel.
server = { path = "../server" }
# `AppState` and the data-directory default the embedded server needs.
host-core = { path = "../host-core" }
# The client side. Same version and features as `host-core` uses, so the lock file
# gains nothing; `blocking` keeps the CLI free of an async client.
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls"], default-features = false }
serde_json = "1"
# A current-thread runtime with the io driver, to run the embedded server.
tokio = { version = "1", features = ["rt", "net"] }
