[package]
name = "cli"
description = "riscdom: the command-line control-plane client"
version.workspace = true
edition.workspace = true

[[bin]]
name = "riscdom"
path = "src/main.rs"

[lib]
name = "riscdom_cli"
path = "src/lib.rs"

[dependencies]
# No `server`: the CLI is a client (v1.0 batch DT / M8-4a). `host-core` is here for the
# two things the CLI parses or composes itself (`toolchain_download::Toolchain`,
# `preflight::STEPS`), not for an `AppState`.
host-core = { path = "../host-core" }
# The client side. Same version and features as `host-core` uses, so the lock file
# gains nothing; `blocking` keeps the CLI free of an async client.
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls"], default-features = false }
serde_json = "1"
