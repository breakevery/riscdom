[package]
name = "ui"
version = "0.4.0"
description = "RiscDom desktop shell (Tauri 2)"
edition = "2021"

[lib]
name = "ui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# Official Tauri 2 dialog plugin: native file pickers for the two path settings
# (the manual text entry stays as the fallback).
tauri-plugin-dialog = "2"
host = { path = "../../host" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Keep this crate out of the root workspace; it builds standalone.
[workspace]
