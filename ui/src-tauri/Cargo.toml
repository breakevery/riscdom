[package]
name = "ui"
version = "0.9.9"
description = "RiscDom desktop shell (Tauri 2)"
edition = "2021"

[lib]
name = "ui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# Official Tauri 2 dialog plugin: native file pickers for the two path settings
# (the manual text entry stays as the fallback).
tauri-plugin-dialog = "2"
host-tauri = { path = "../../host-tauri" }
# The control plane, embedded (v0.9.9 内网接入 batch 3): the shell starts it over
# the app's own state handle, so a phone sees the node this window is running.
# Only this crate takes the edge — `host-tauri` stays Transport-free.
server = { path = "../../server" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Keep this crate out of the root workspace; it builds standalone.
[workspace]
