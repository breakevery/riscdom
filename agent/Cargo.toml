[package]
name = "agent"
version = "0.1.0"
edition = "2021"

[dependencies]
sandbox = { path = "../sandbox" }
audit = { path = "../audit" }
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
