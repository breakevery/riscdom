[package]
name = "host"
description = "The Tauri half of the RiscDom host backend (commands + facade)"
version.workspace = true
edition.workspace = true

[dependencies]
# The portable half. `host` re-exports its public surface, so a consumer written
# against the pre-split `host` keeps compiling unchanged (A1 W1).
host-core = { path = "../host-core" }
tauri = { version = "2", features = [] }
# `Value` in the `TauriEventSink` impl; `host-core` owns the envelope itself.
serde_json = "1"
# Kept as it was — nothing here uses it (see the reconnaissance). Its direct edge
# is dead; removing it belongs to a later wave, not to the crate split.
tokio = { version = "1", features = ["sync"] }

# Until A1 W2 moves `host/tests` into `host-core/tests`, these integration tests
# live in this package and name these crates directly. (`serde_json` above is a
# regular dependency, so the tests may use it too.)
[dev-dependencies]
agent = { path = "../agent" }
audit = { path = "../audit" }
sandbox = { path = "../sandbox" }
sha2 = "0.10"
rusqlite = { version = "0.32", features = ["bundled"] }

[target.'cfg(target_os = "windows")'.dev-dependencies]
zip = "2"

[target.'cfg(not(target_os = "windows"))'.dev-dependencies]
flate2 = "1"
tar = "0.4"
